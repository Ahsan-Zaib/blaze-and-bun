<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#B80F2A"/>
    </radialGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC95E"/><stop offset="0.55" stop-color="#EE9A2B"/><stop offset="1" stop-color="#C46A14"/>
    </linearGradient>
    <linearGradient id="bunB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A63A"/><stop offset="1" stop-color="#B85F12"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4122"/><stop offset="1" stop-color="#2E1508"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/><stop offset="1" stop-color="#F5B90F"/>
    </linearGradient>
    <linearGradient id="tom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4B4B"/><stop offset="1" stop-color="#C41E2A"/>
    </linearGradient>
    <linearGradient id="let" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE04A"/><stop offset="1" stop-color="#4C9A1F"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <ellipse cx="64" cy="116" rx="44" ry="5" fill="#000" opacity="0.28"/>

  <!-- bottom bun -->
  <path d="M19 98 H109 Q109 113 94 113 H34 Q19 113 19 98 Z" fill="url(#bunB)"/>
  <path d="M26 104 Q64 108 102 104" stroke="#FFD88A" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- patty -->
  <rect x="15" y="82" width="98" height="18" rx="9" fill="url(#patty)"/>
  <g fill="#1E0C04" opacity="0.7">
    <circle cx="30" cy="91" r="2"/><circle cx="48" cy="94" r="1.8"/><circle cx="66" cy="90" r="2"/>
    <circle cx="84" cy="94" r="1.8"/><circle cx="99" cy="90" r="2"/>
  </g>
  <rect x="20" y="84" width="88" height="3" rx="1.5" fill="#B9733F" opacity="0.45"/>

  <!-- cheese with drips -->
  <path d="M14 80 H114 L108 84 L103 96 Q101 99 99 96 L96 86 H40 L34 94 Q32 97 30 94 L26 84 Z" fill="url(#cheese)"/>
  <rect x="14" y="80" width="100" height="2.5" fill="#FFF3A0" opacity="0.6"/>

  <!-- tomato -->
  <rect x="20" y="72" width="88" height="10" rx="5" fill="url(#tom)"/>
  <rect x="26" y="74" width="40" height="2.5" rx="1.2" fill="#FF9A9A" opacity="0.55"/>

  <!-- lettuce -->
  <path d="M10 62 Q18 74 27 66 Q36 76 46 67 Q56 77 66 67 Q76 77 86 67 Q96 76 102 66 Q111 74 118 62 L116 62 L12 62 Z" fill="url(#let)"/>
  <path d="M12 62 H116 L114 66 H14 Z" fill="#6FBF2E"/>

  <!-- top bun -->
  <path d="M18 64 C18 34 40 18 64 18 C88 18 110 34 110 64 Q64 70 18 64 Z" fill="url(#bun)"/>
  <path d="M30 38 Q42 24 62 23" stroke="#FFF1C6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- sesame -->
  <g fill="#FFF6DA">
    <ellipse cx="42" cy="40" rx="3.6" ry="2" transform="rotate(-30 42 40)"/>
    <ellipse cx="58" cy="32" rx="3.6" ry="2" transform="rotate(10 58 32)"/>
    <ellipse cx="76" cy="36" rx="3.6" ry="2" transform="rotate(35 76 36)"/>
    <ellipse cx="90" cy="48" rx="3.6" ry="2" transform="rotate(60 90 48)"/>
    <ellipse cx="66" cy="50" rx="3.6" ry="2" transform="rotate(-15 66 50)"/>
    <ellipse cx="46" cy="55" rx="3.6" ry="2" transform="rotate(20 46 55)"/>
    <ellipse cx="30" cy="52" rx="3.2" ry="1.8" transform="rotate(-50 30 52)"/>
  </g>
</svg>
